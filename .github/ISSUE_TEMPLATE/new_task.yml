name: "🚀 기능 개발 (Feature Request)"
description: "새로운 기능 구현 및 변경 사항을 등록할 때 사용합니다."
title: "Feat: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        팀 프로젝트 진행을 위해 추가할 기능에 대해 명확히 적어주세요!

  - type: textarea
    id: description
    attributes:
      label: "✨ 어떤 기능인가요?"
      description: "구현하고자 하는 기능의 핵심 내용을 간결하게 설명해 주세요."
      placeholder: "예시: 카카오 소셜 로그인을 통해 사용자가 회원가입을 할 수 있는 기능을 구현합니다."
    validations:
      required: true

  - type: textarea
    id: todo-list
    attributes:
      label: "🛠️ 해야 할 일 (Todo List)"
      description: "이 기능을 완료하기 위해 세부적으로 작업해야 할 체크리스트를 적어주세요."
      placeholder: |
        - [ ] 인가 코드 받기 API 구현
        - [ ] 카카오 토큰 발급 및 사용자 정보 조회 구현
        - [ ] 자체 JWT 발급 및 공통 응답 처리
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: "📌 기타 참고 사항 (선택)"
      description: "팀원들과 공유하고 싶은 API 명세, 설계 구조, 참고 링크 등이 있다면 자유롭게 적어주세요."
      placeholder: "예시: 카카오 개발자 문서 링크 (https://developers.kakao.com)"
    validations:
      required: false