spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/DB명}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:86400000}

portone:
  base-url: ${PORTONE_BASE_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

dummy:
  search:
    enabled: false  # 더미데이터 생성 시 TRUE로 변경
    size: 50000
    batch-size: 1000
    cleanup-before-load: true
    seller-email: dummy-seller@gifbottary.local
    seller-name: 더미 판매자
    product-name-prefix: DUMMY-SEARCH