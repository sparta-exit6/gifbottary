<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | 기프보따리</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='./index.html'">
        <span class="logo-icon">🎁</span>
        <span>기프보따리</span>
    </div>

    <div class="search-box">
        <input type="text" placeholder="검색어를 입력하세요">
        <button>🔍</button>
    </div>

    <nav class="nav">
        <button onclick="goRegisterPage()">상품 등록</button>
        <button onclick="location.href='./chat.html'">채팅</button>
        <button onclick="logout()">로그아웃</button>
    </nav>
</header>

<main class="mypage-wrap">

    <aside class="mypage-sidebar">
        <div class="mypage-profile">
            <div class="profile-circle">👤</div>
            <h3 id="sidebarName">사용자</h3>
            <p id="sidebarEmail">email@example.com</p>
        </div>

        <nav class="mypage-menu">
            <button class="active">내 정보</button>
            <button onclick="location.href='./purchases.html'">구매내역</button>
            <button onclick="location.href='./my-products.html'">판매내역</button>
            <button onclick="location.href='./chat.html'">채팅목록</button>
            <button onclick="location.href='./index.html'">메인으로</button>
        </nav>
    </aside>

    <section class="mypage-main">
        <div class="mypage-title-box">
            <h1>마이페이지</h1>
            <p>내 회원 정보와 포인트를 확인할 수 있습니다.</p>
        </div>

        <section class="my-info-card">
            <div class="card-header">
                <h2>내 정보 조회</h2>
                <span id="roleBadge" class="role-badge">USER</span>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <span>회원 ID</span>
                    <strong id="userId">-</strong>
                </div>

                <div class="info-item">
                    <span>이메일</span>
                    <strong id="userEmail">-</strong>
                </div>

                <div class="info-item">
                    <span>이름</span>
                    <strong id="userName">-</strong>
                </div>

                <div class="info-item">
                    <span>권한</span>
                    <strong id="userRole">-</strong>
                </div>

                <div class="info-item point">
                    <span>보유 포인트</span>
                    <strong id="pointBalance">0 P</strong>
                </div>
            </div>
        </section>

        <section class="mypage-shortcuts">
            <div class="shortcut-card" onclick="location.href='./purchases.html'">
                <div class="shortcut-icon">🧾</div>
                <h3>구매내역</h3>
                <p>구매한 기프트카드와 핀번호를 확인합니다.</p>
            </div>

            <div class="shortcut-card" onclick="location.href='./my-products.html'">
                <div class="shortcut-icon">📦</div>
                <h3>판매내역</h3>
                <p>내가 등록한 상품과 판매 상태를 확인합니다.</p>
            </div>

            <div class="shortcut-card" onclick="location.href='./chat.html'">
                <div class="shortcut-icon">💬</div>
                <h3>채팅목록</h3>
                <p>구매자 또는 판매자와의 채팅을 확인합니다.</p>
            </div>
        </section>
    </section>

</main>

<script src="./js/app.js"></script>
<script src="./js/mypage.js"></script>
</body>
</html>
