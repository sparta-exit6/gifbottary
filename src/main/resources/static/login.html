<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 | 기프보따리</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="login-page">

    <div class="login-container">

        <section class="login-box">

            <div class="login-brand">
                <div class="brand-logo-box">🎁</div>
                <h1>기프보따리</h1>
                <p>기프트 & 모바일쿠폰</p>
            </div>

            <div class="login-form-area">
                <h2>로그인</h2>

                <div class="form-row">
                    <label for="loginEmail">이메일</label>
                    <input id="loginEmail" type="email" placeholder="이메일을 입력하세요">
                </div>

                <div class="form-row">
                    <label for="loginPassword">비밀번호</label>
                    <input id="loginPassword" type="password" placeholder="비밀번호를 입력하세요">
                </div>

                <button class="login-submit-btn" onclick="login()">로그인</button>

                <p class="signup-guide">
                    아직 계정이 없으신가요?
                    <a href="./signup.html">회원가입</a>
                </p>

                <button class="home-move-btn" onclick="location.href='./index.html'">
                    메인으로
                </button>
            </div>

        </section>

    </div>

</div>

<script src="./js/app.js"></script>
</body>
</html>
