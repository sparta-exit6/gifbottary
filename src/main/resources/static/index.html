<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기프보따리</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='/index.html'">
        <span class="logo-icon">🎁</span>
        <span>기프보따리</span>
    </div>

    <div class="search-box">
        <input id="mainSearchInput" type="text" placeholder="검색어를 입력하세요"
               onkeydown="handleMainSearchEnter(event)">
        <button onclick="moveMainSearchPage()">🔍</button>
    </div>

    <nav class="nav">
        <button onclick="goRegisterPage()">상품 등록</button>
        <button onclick="location.href='./signup.html'">회원가입</button>
        <button onclick="location.href='./login.html'">로그인</button>
        <button class="profile-btn" onclick="location.href='./mypage.html'">👤</button>
    </nav>
</header>

<main class="container">

    <section class="hero">
        <div class="hero-text">
            <h1>
                기프보따리에서<br>
                <span>필요한 기프트카드를 저렴하게!</span>
            </h1>
            <p>개인판매부터 관리자 판매까지 모두 한 곳에서</p>
        </div>

        <div class="hero-visual">
            <div class="gift-card card-blue">GIFT CARD</div>
            <div class="gift-card card-green">MEGABOX</div>
            <div class="gift-box">🎁</div>
        </div>

        <div class="hero-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>
    </section>

    <section class="product-section">
        <h2>개인 판매 기프트카드</h2>

        <div class="product-grid" id="personalProductList"></div>
    </section>

    <section class="product-section">
        <h2>관리자 판매 기프트카드</h2>

        <div class="product-grid" id="adminProductList"></div>
    </section>

    <section class="benefit-section">
        <div class="benefit-card">
            <div class="benefit-icon">🛡️</div>
            <div>
                <strong>안전한 거래</strong>
                <p>검증된 시스템으로 안전하게</p>
            </div>
        </div>

        <div class="benefit-card">
            <div class="benefit-icon">%</div>
            <div>
                <strong>저렴한 가격</strong>
                <p>최저가로 만나보세요</p>
            </div>
        </div>

        <div class="benefit-card">
            <div class="benefit-icon">⚡</div>
            <div>
                <strong>빠른 발송</strong>
                <p>구매 즉시 바로 발송</p>
            </div>
        </div>

        <div class="benefit-card">
            <div class="benefit-icon">🎧</div>
            <div>
                <strong>고객센터</strong>
                <p>24시간 친절한 상담</p>
            </div>
        </div>
    </section>

</main>

<script src="./js/app.js"></script>
</body>
</html>
