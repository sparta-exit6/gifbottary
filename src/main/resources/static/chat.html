<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅 | 기프보따리</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='./index.html'">
        <span class="logo-icon">🎁</span>
        <span>기프보따리</span>
    </div>

    <div class="search-box">
        <input type="text" placeholder="검색어를 입력하세요">
        <button>🔍</button>
    </div>

    <nav class="nav">
        <button onclick="location.href='./index.html'">메인</button>
        <button onclick="location.href='./mypage.html'">마이페이지</button>
    </nav>
</header>

<main class="chat-page">

    <section class="chat-container">

        <aside class="chat-left-panel">

            <div class="chat-product-box">
                <h3>거래 상품</h3>

                <div class="chat-product-image bg-starbucks">
                    STARBUCKS
                </div>

                <h4>스타벅스 아메리카노 Tall</h4>
                <p>판매가 4,300원</p>
                <span class="status-selling">판매중</span>

                <button onclick="location.href='./product-detail.html'">상품 보기</button>
                <button class="buy-small-btn">구매하기</button>
            </div>

            <div class="chat-list-box">
                <h3>채팅 목록</h3>

                <div id="chatRoomList" class="chat-room-list">
                    <div class="chat-room-item active">
                        <div class="chat-avatar">김</div>
                        <div>
                            <strong>홍길동</strong>
                            <p>안녕하세요~</p>
                        </div>
                        <span class="unread-count">1</span>
                    </div>
                </div>
            </div>

            <button class="leave-chat-btn" onclick="leaveChatRoom()">채팅방 나가기</button>
        </aside>

        <section class="chat-main-panel">

            <div class="chat-top">
                <div class="chat-user-info">
                    <div class="chat-avatar large">홍</div>
                    <div>
                        <h3>판매자 홍길동</h3>
                        <p>● 온라인</p>
                    </div>
                </div>
            </div>

            <div id="messageList" class="chat-message-list">
                <div class="message-row me">
                    <div class="message-bubble">안녕하세요! 혹시 지금 상품 판매중인가요?</div>
                    <span class="message-time">14:30</span>
                </div>

                <div class="message-row other">
                    <div class="chat-avatar">홍</div>
                    <div>
                        <div class="message-bubble">안녕하세요~ 네 가능합니다!</div>
                        <span class="message-time">14:31</span>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <input id="messageInput" type="text" placeholder="메시지를 입력하세요..."
                       onkeydown="handleMessageEnter(event)">
                <button onclick="sendMessage()">전송</button>
            </div>

        </section>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="./js/chat.js"></script>
</body>
</html>
